<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When Pigs Fly</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 22 L8 4 L26 14 Z' fill='%23e57399'/%3E%3Cpath d='M54 22 L56 4 L38 14 Z' fill='%23e57399'/%3E%3Ccircle cx='32' cy='35' r='25' fill='%23f8a5c2'/%3E%3Cellipse cx='32' cy='42' rx='13' ry='9.5' fill='%23f48fb1' stroke='%23c05b74' stroke-width='2'/%3E%3Cellipse cx='27' cy='42' rx='2.6' ry='3.6' fill='%238d3a55'/%3E%3Cellipse cx='37' cy='42' rx='2.6' ry='3.6' fill='%238d3a55'/%3E%3Ccircle cx='21' cy='27' r='3.6' fill='%233b2a20'/%3E%3Ccircle cx='43' cy='27' r='3.6' fill='%233b2a20'/%3E%3Ccircle cx='22.2' cy='25.8' r='1.2' fill='%23fff'/%3E%3Ccircle cx='44.2' cy='25.8' r='1.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --ink: #3b2a20; --paper: #fff8ee; --pink: #f48fb1; --pinkd: #c05b74; --green: #4caf50; --gold: #f5b800; --shadow: 0 4px 0 rgba(0,0,0,0.18); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f5; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 12px; padding: 8px 14px; background: #fff; color: var(--ink); box-shadow: var(--shadow); font-weight: bold; }
  button:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
  button:disabled { opacity: 0.45; cursor: default; }
  .big { font-size: 22px; padding: 12px 26px; }
  .go { background: #66bb6a; color: #fff; }
  .warn { background: #ef5350; color: #fff; }
  .gold { background: var(--gold); color: #3b2a20; }
  .pinkb { background: var(--pink); color: #fff; }
  .card { background: var(--paper); border-radius: 18px; box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 10px 30px rgba(0,0,0,0.2); padding: 18px 22px; }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
  h1 { margin: 0; font-size: 64px; color: #fff; text-shadow: 0 5px 0 var(--pinkd), 0 10px 20px rgba(0,0,0,0.25); letter-spacing: 1px; }
  h2 { margin: 0 0 8px; }
  .menu { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .menu button { min-width: 260px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { opacity: 0.7; font-size: 13px; }
  /* hangar / shop */
  #shop { position: absolute; left: 50%; transform: translateX(-50%); top: 12px; bottom: 12px; width: min(1500px, calc(100% - 24px)); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #shop .head { display: flex; gap: 16px; align-items: center; }
  #shop .head .info { flex: 1; }
  .pigcard { position: relative; flex: none; }
  .pigtag { position: absolute; left: 8px; bottom: 6px; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--pinkd); color: #fff; font-weight: bold; font-size: 13px; padding: 2px 10px; border-radius: 999px; }
  #shopPreview { width: 230px; height: 120px; background: linear-gradient(#bfe6fb, #e8f6fd); border-radius: 12px; flex: none; }
  .tiergrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 18px 22px; }
  .tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; align-items: start; }
  #shop .head { padding: 12px 16px 10px; border-bottom: 2px dashed #ead9c4; }
  #shop .coins { font-size: 28px; font-weight: bold; color: #a87900; }
  #shop .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 2px dashed #ead9c4; }
  #shop .tabs button { padding: 8px 16px; font-size: 17px; }
  #shop .tabs button.on { background: var(--pink); color: #fff; }
  #shop .body { flex: 1; overflow-y: auto; padding: 14px 18px; font-size: 16px; }
  #shop .foot { padding: 10px 12px; border-top: 2px dashed #ead9c4; display: flex; gap: 8px; align-items: center; }
  /* each tier is its own panel so neighbouring tiers never blend together */
  .tier { background: #f6e3cc; border: 2px solid #dcbf9c; border-radius: 16px; padding: 10px 12px 12px; box-shadow: 0 3px 0 rgba(120,80,40,0.15); }
  .tier.later { background: transparent; border-style: dashed; box-shadow: none; opacity: 0.6; }
  .tier .tt { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding-bottom: 8px; border-bottom: 2px solid #dcbf9c; }
  .tier .tt .price { margin-left: auto; font-size: 17px; }
  .tbadge { background: var(--pinkd); color: #fff; font-weight: bold; font-size: 17px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 12px; border-radius: 999px; }
  .tier.later .tbadge { background: #a1887f; }
  .tstate { font-size: 13px; font-weight: bold; color: #2e7d32; }
  .tnum { display: inline-block; min-width: 24px; text-align: center; font-size: 12px; font-weight: bold; color: #fff; background: var(--pinkd); border-radius: 999px; padding: 1px 6px; margin-right: 8px; }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .opt { background: #fff; border-radius: 14px; padding: 8px; text-align: center; border: 3px solid transparent; font-size: 14px; }
  .opt.eq { border-color: #66bb6a; }
  .opt.locked { opacity: 0.5; }
  .opt canvas { width: 100%; height: 110px; display: block; }
  .opt .nm { font-weight: bold; font-size: 16px; line-height: 1.15; min-height: 20px; margin-top: 2px; }
  .opt .ds { font-size: 13px; opacity: 0.75; min-height: 32px; }
  .opt button { padding: 6px 12px; font-size: 14px; margin: 3px 2px 0; border-radius: 9px; }
  .pips { font-size: 12px; text-align: left; margin: 3px auto; width: fit-content; }
  .pips b { display: inline-block; width: 52px; }
  .pip { display: inline-block; width: 9px; height: 9px; border-radius: 5px; background: #e0d3c3; margin-right: 1px; }
  .pip.on { background: #ef8fb0; }
  .track { background: #fff; border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; }
  .track .ti { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font-size: 16px; }
  .track .ti:nth-of-type(odd) { background: #f8ecdd; }
  .track .ti.eq { outline: 2px solid #66bb6a; outline-offset: -2px; }
  .track b { display: block; margin-bottom: 6px; }
  .track .ti .n { flex: 1; }
  .track .ti.eq .n { color: #2e7d32; font-weight: bold; }
  .track .ti button { padding: 5px 12px; font-size: 14px; border-radius: 9px; }
  .price { color: #a87900; font-weight: bold; white-space: nowrap; }
  .lock { font-size: 11px; opacity: 0.7; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 6px; background: #e8f5e9; color: #2e7d32; font-weight: bold; }
  /* overlays */
  .modalbg { position: absolute; inset: 0; background: rgba(40,20,10,0.35); display: flex; align-items: center; justify-content: center; }
  .results { min-width: 380px; text-align: center; }
  .results .big-n { font-size: 46px; font-weight: bold; }
  .results .line { margin: 4px 0; }
  .tutor { position: absolute; max-width: 320px; background: #fffbe6; border: 3px solid #f5b800; border-radius: 14px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); font-size: 15px; z-index: 50; }
  .tutor .tb { margin-top: 8px; display: flex; gap: 6px; justify-content: flex-end; }
  .tutor .tb button { font-size: 12px; padding: 4px 10px; }
  .tutor .arrow { position: absolute; width: 0; height: 0; border: 10px solid transparent; }
  .hl { outline: 4px solid #f5b800 !important; outline-offset: 2px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { outline-color: #ff7043; } }
  .key { display: inline-block; min-width: 26px; padding: 1px 6px; border-radius: 6px; background: #fff; border: 2px solid #bfa98f; border-bottom-width: 4px; font-weight: bold; text-align: center; }
  .lb { margin-top: 14px; width: 300px; }
  .topbtn { position: absolute; left: 12px; top: 12px; }
  #toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); }
  .toast { background: #fffbe6; border: 3px solid #f5b800; border-radius: 12px; padding: 6px 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin-bottom: 6px; }
  .who { color: #fff; font-weight: bold; text-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
  .fld input { font: inherit; font-size: 20px; padding: 8px 10px; border-radius: 10px; border: 2px solid #d9c7b0; background: #fff; color: var(--ink); letter-spacing: 2px; }
  .fld input:focus { outline: 3px solid #f5b800; border-color: #f5b800; }
  .acct-msg { min-height: 20px; color: #c62828; font-weight: bold; margin-bottom: 8px; }
  .reccode { font-size: 32px; font-weight: bold; letter-spacing: 4px; text-align: center; padding: 12px; margin: 10px 0; background: #fff; border: 3px dashed #f5b800; border-radius: 12px; user-select: all; }
  .lb { width: min(380px, calc(100vw - 32px)); max-height: 40vh; overflow-y: auto; }
  .lbl { list-style: none; margin: 0; padding: 0; text-align: left; font-variant-numeric: tabular-nums; }
  .lbl li { display: flex; gap: 10px; padding: 5px 8px; border-radius: 8px; }
  .lbl li:nth-child(odd) { background: rgba(0,0,0,0.04); }
  .lbl li.me { background: #fde2ec; }
  .lbl .rk { width: 24px; opacity: 0.6; }
  .lbl .sc { margin-left: auto; font-weight: bold; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<script id="core">
/* =====================================================================
   WHEN PIGS FLY — CONFIG
   Every tuning number lives here. Change values, save, refresh the page.
   Units: meters, seconds, meters/second. Coins are the only currency.
   (proposed) = default taken from SPEC.md. [default] = number the spec
   left open; picked by me and balance-tested with a headless bot.
   ===================================================================== */
const CONFIG = {
  // ---------- FLIGHT PHYSICS ----------
  physics: {
    gravity: 9.8,
    stepsPerSecond: 120,        // fixed physics step
    bodyDrag: 0.0003,           // [default] drag of the egg-shaped pig (accel = k * speed^2)
    bodyLift: 0.002,            // [default] tiny lift from the body alone (no wings = nearly ballistic)
    bodyStability: 0.5,         // [default] how strongly the bare pig's nose follows its motion
    turnRateDeg: 60,            // [default] how fast the arrow keys tilt the nose (deg/s) — slow on purpose
    stabilitySpeedRef: 25,      // [default] speed where wing steadiness has its listed strength
    stabilityMinQ: 1,           // [default] steadiness never drops below this multiple (slow flight)
    stabilityMaxQ: 4,           // [default] ...or rises above this multiple (fast flight = less arrow authority)
    autoPathGain: 0.6,          // [default] wings settle into a glide on their own (gear does the work)
    autoStallMarginDeg: 3,      // [default] the natural trim stays this far below the stall angle
    clMaxRatio: 1.5,             // [default] max wing lift vs. lift at cruise speed (lower = stalls closer to cruise)
    autoFlareHeight: 6,          // [default] below this height (m) over open water the pig flares on its own
    stallLiftMult: 0.3,         // (proposed) pulling up too hard stalls: lift drops to this fraction...
    stallDragAdd: 0.006,        // ...and drag goes up by this much
    maxLiftG: 2.5,              // [default] lift can never exceed this many g (no loop-the-loops)
    maxPitchDeg: 90,            // nose can point straight up or straight down, never backwards
    pigRadius: 1.0,             // collision size (m)
    skidFriction: 0.6,          // [default] landing skid. Arriving too fast slides you off the far edge.
    bounceSpeed: 7,             // [default] touching down faster than this (m/s straight down) bounces instead of landing
    bounceKeep: 0.6,            // [default] share of downward speed turned into the bounce
    autoRocketClimbDeg: 20,     // [default] while the rocket fires, the natural trim climbs at about this angle
  },

  // ---------- LAUNCH (seesaw / catapult) ----------
  launch: {
    baseSpeed: 24,              // [default] Wobbly Plank + Flat Rock launch speed (m/s)
    baseAngleDeg: 30,           // [default] launch angle
    baseHeight: 3,              // [default] height of the plank tip above the water (m)
    dropTime: 0.55,             // [default] seconds for the feed sack to fall onto the seesaw
    flingTime: 0.18,            // [default] seconds for the plank to swing before the pig leaves
  },
  // Seesaw Length & Height: index = tier (0 = start, last = Endless tier). Values are cumulative bonuses.
  seesawLength: { speed: [0, 0.67, 1.18, 1.87, 2.94, 4.17, 5.58, 7.2, 9.06, 12.04] },
  seesawHeight: {
    speed:    [0, 0.34, 0.59, 0.93, 1.47, 2.08, 2.79, 3.6, 4.53, 6.02],
    raise:    [0, 0.67, 1.18, 1.87, 2.94, 4.17, 5.58, 7.2, 9.06, 12.04], // meters higher launch
    angleDeg: [0, 0.8, 1.6, 2.4, 3.2, 4, 4.8, 5.6, 6.4, 7.2],
  },
  launchRig: { speed: [0, 1.16, 3.45, 6.01, 8.88, 12.09, 15.69, 19.72, 25.76] }, // tiers 0..7 + Endless

  // ---------- WINGS: 3 options per tier ----------
  // glide = distance per meter of height (glide ratio). cruise = speed it likes to fly at (m/s).
  // steady = how firmly it holds its glide (high = calm, but harder to steer or bring down).
  // right = which option (0=A,1=B,2=C) is the "right" pick for the level that tier is made for.
  wings: {
    right: [null, 1, 0, 2, 0, 1, 2, 1, 0, 2, 0],
    tiers: [null,
      [{ glide: 8.3, cruise: 21.5, steady: 6.5 }, { glide: 4.9, cruise: 21, steady: 4.5 }, { glide: 2.9, cruise: 19, steady: 4.5 }],
      [{ glide: 8.7, cruise: 21, steady: 5 }, { glide: 5.2, cruise: 19, steady: 5 }, { glide: 14.8, cruise: 21.5, steady: 7 }],
      [{ glide: 7.6, cruise: 19, steady: 5.5 }, { glide: 21.4, cruise: 21.5, steady: 7.5 }, { glide: 12.6, cruise: 21, steady: 5.5 }],
      [{ glide: 15.1, cruise: 21, steady: 6 }, { glide: 9.1, cruise: 19, steady: 6 }, { glide: 25.7, cruise: 21.5, steady: 8 }],
      [{ glide: 32.6, cruise: 21.5, steady: 8.5 }, { glide: 19.2, cruise: 21, steady: 6.5 }, { glide: 11.5, cruise: 19, steady: 6.5 }],
      [{ glide: 13.7, cruise: 19, steady: 7 }, { glide: 38.9, cruise: 21.5, steady: 9 }, { glide: 22.9, cruise: 21, steady: 7 }],
      [{ glide: 44.2, cruise: 21.5, steady: 9.5 }, { glide: 26, cruise: 21, steady: 7.5 }, { glide: 15.6, cruise: 19, steady: 7.5 }],
      [{ glide: 28.7, cruise: 21, steady: 8 }, { glide: 17.2, cruise: 19, steady: 8 }, { glide: 48.8, cruise: 21.5, steady: 10 }],
      [{ glide: 18.6, cruise: 19, steady: 8.5 }, { glide: 52.7, cruise: 21.5, steady: 10.5 }, { glide: 31, cruise: 21, steady: 8.5 }],
      // Endless tier
      [{ glide: 35, cruise: 23, steady: 8 }, { glide: 36.5, cruise: 19.5, steady: 10 }, { glide: 33.5, cruise: 21, steady: 12 }],
    ],
  },

  // ---------- ROCKETS: 3 options per tier ----------
  // thrust = push in the direction the nose points (m/s^2; gravity is 9.8).
  // noseUp = how hard the rocket tips the nose up while firing (deg/s). Good wings resist it; bad wings don't.
  rockets: {
    right: [null, 2, 0, 1, 2, 0, 1, 0],
    tiers: [null,
      [{ thrust: 1.81, noseUp: 20 }, { thrust: 3.88, noseUp: 50 }, { thrust: 2.59, noseUp: 25 }],
      [{ thrust: 3.07, noseUp: 30 }, { thrust: 2.15, noseUp: 25 }, { thrust: 4.6, noseUp: 55 }],
      [{ thrust: 5.16, noseUp: 60 }, { thrust: 3.44, noseUp: 35 }, { thrust: 2.41, noseUp: 30 }],
      [{ thrust: 3.13, noseUp: 35 }, { thrust: 6.71, noseUp: 65 }, { thrust: 4.47, noseUp: 40 }],
      [{ thrust: 5.81, noseUp: 45 }, { thrust: 4.07, noseUp: 40 }, { thrust: 8.71, noseUp: 70 }],
      [{ thrust: 11.32, noseUp: 75 }, { thrust: 7.55, noseUp: 50 }, { thrust: 5.28, noseUp: 45 }],
      // Endless tier
      [{ thrust: 12.16, noseUp: 70 }, { thrust: 10.57, noseUp: 40 }, { thrust: 9.51, noseUp: 25 }],
    ],
  },
  // Fuel tank: tiers 0..6 + Endless, named by gallons. Fuel is free and refills every flight.
  fuelTank: { gallons: [1, 3, 5, 10, 15, 18, 20, 30], secondsPerGallon: 0.25 }, // [default] burn time per gallon

  // ---------- PAYLOAD & OBSTACLES ----------
  payload: { strength: [0, 1, 2, 3, 4, 5] },  // tier 0 = none. Breaks obstacles with strength <= this.
  obstacles: {
    // Level obstacles (positions, heights) are listed per level below.
    endlessFirstAfterSec: [8, 12],     // [default] seconds into an endless flight before the first obstacle
    endlessGapSec: [6.5, 12],          // spec: at least 5 s apart, randomized (e.g. 5-12). Min 6.5 keeps >=5 s even with a speed boost.
    endlessLookaheadSec: 2.5,          // obstacles appear this far ahead (seconds of flight)
    endlessStrengthByDistance: [[0, 1], [800, 2], [1800, 3], [3000, 4], [4500, 5]], // [meters, strength]
    clearanceBase: 6,                  // [default] obstacle top = your path height + base + share * height (flying over needs ~2 bigger fuel tanks + aiming up)
    clearanceShare: 0.08,
    widths: { tree: 10, farmhouse: 16, hill: 30 },
  },

  // ---------- LEVELS ----------
  // hillX = where the flat hilltop starts (m from the seesaw). hillWidth = flat top length. hillHeight = height above water.
  // slope = horizontal length of the hill's sides. Obstacles: x, top (m), width, strength, type.
  // Generated by the balance tool for the reference gear path (see NOTES.md), then hand-checked.
  levels: [
    { hillX: 49, hillWidth: 79, hillHeight: 4, slope: 10, obstacles: [] },
    { hillX: 65, hillWidth: 45, hillHeight: 4, slope: 10, obstacles: [] },
    { hillX: 93, hillWidth: 59, hillHeight: 5, slope: 10, obstacles: [] },
    { hillX: 132, hillWidth: 74, hillHeight: 5, slope: 10, obstacles: [] },
    { hillX: 215, hillWidth: 71, hillHeight: 6, slope: 11, obstacles: [] },
    { hillX: 308, hillWidth: 85, hillHeight: 7, slope: 13, obstacles: [] },
    { hillX: 370, hillWidth: 95, hillHeight: 8, slope: 14, obstacles: [{ x: 91, top: 37, width: 10, strength: 1, type: 'tree' }] },
    { hillX: 532, hillWidth: 120, hillHeight: 10, slope: 18, obstacles: [{ x: 98, top: 49, width: 10, strength: 1, type: 'tree' }, { x: 231, top: 34, width: 30, strength: 1, type: 'hill' }] },
    { hillX: 638, hillWidth: 137, hillHeight: 12, slope: 22, obstacles: [{ x: 103, top: 57, width: 10, strength: 1, type: 'tree' }, { x: 238, top: 42, width: 16, strength: 2, type: 'farmhouse' }, { x: 381, top: 35, width: 30, strength: 1, type: 'hill' }] },
    { hillX: 982, hillWidth: 189, hillHeight: 14, slope: 25, obstacles: [{ x: 88, top: 76, width: 16, strength: 2, type: 'farmhouse' }, { x: 198, top: 58, width: 10, strength: 1, type: 'tree' }, { x: 331, top: 53, width: 30, strength: 1, type: 'hill' }, { x: 466, top: 47, width: 16, strength: 2, type: 'farmhouse' }] },
  ],

  // ---------- PIG ----------
  pig: { defaultName: 'Snowball', nameMaxLength: 16 }, // [user request] players name their pig at Start New Game; blank = Snowball

  // ---------- UNLOCKS (exact order from the spec) ----------
  unlocks: { wings: 2, seesaw: 3, launchRig: 4, rockets: 5, powerups: 6, payload: 7 }, // = first level it's available on

  // ---------- ECONOMY ----------
  economy: {
    // Price of "one upgrade" for each level (index = level). Prices go up each level. 11 = Endless tier base.
    upgradeCost: [0, 0, 40, 55, 76, 105, 145, 200, 276, 381, 526, 726], // [default]
    endlessTierMult: 1.5,        // [default] Endless tier costs upgradeCost[11] * this
    share: { wings: 1, length: 0.5, height: 0.5, launchRig: 1, rocket: 0.75, fuel: 0.25, payload: 1 }, // seesaw halves = 1 upgrade; rocket+fuel = 1 upgrade
    payoutUpgrades: 3,           // first clear of a level pays 3x one upgrade (at the next level's price)...
    payoutPerCategory: true,     // [user request] ...but never more upgrades than there are shop categories open on the next level
                                 //   (level 2 has only Wings -> 1x, level 3 Wings+Seesaw -> 2x, level 4+ -> 3x)
    edgePayoutUpgrades: 2.5,     // [user request] landing dead center between the flags pays the full payoutUpgrades (3x);
                                 //   stopping right at a flag pays only this many (2.5x). Linear in between.
                                 //   Early levels (1x/2x) can't drop below what you need, so there centering ADDS the same 1/6 as a bonus.
    mistakeCushion: 0.4,         // [default] while paying under 3x, add this share of one upgrade: exactly the 40% lost selling back
                                 //   one wrong pick, so a wrong wing on level 2/3 can't leave you stuck. Set 0 for no cushion.
    sellBack: 0.6,               // sell gear back for 60%
    startMoney: 0,
  },
  coins: {
    perRunShare: 0.017,          // coins on a level's flight path = this share of one upgrade (~5 when gear is ~300)
    pickupRadius: 3,             // [default] meters
    endlessSpacing: 220,         // [default] one coin every this many meters along the path in Fly Infinitely
  },
  powerups: {
    firstCost: 5, costMult: 2,   // 5, 10, 20, 40, 80... (doubling is the only limit)
    gustSpeed: 5,                // [default] same strength every time: a bit of speed...
    gustUp: 4,                   // [default] ...and a bit of height (m/s upward)
    pickupRadius: 4,             // [default]
    placeMinX: 25,               // [default] earliest spot along the route (m)
    placeMaxShare: 1.15,         // [default] latest spot = this share of where your gear naturally lands
    hillGap: 5,                  // [user request] levels: never past the landing hill; latest spot = this many m before the hill starts
    heightJitter: [0.55, 1.45],  // [default] multiple of your expected height there (some will be out of reach)
    coinTable: [{ min: 0, max: 5, chance: 80 }, { min: 6, max: 9, chance: 15 }, { min: 10, max: 20, chance: 5 }],
  },
  endless: {
    milestoneEvery: 250,         // [default] meters between distance markers

// Highest regular tier per category (the Endless tier is one more).
const MAX_TIER = { wings: 9, length: 8, height: 8, launchRig: 7, rocket: 6, fuel: 6, payload: 4 };

/* ===================== SIM CORE (no DOM) ===================== */
const D2R = Math.PI / 180;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function wrapAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }

}

// Designer-facing wing numbers -> flight-model numbers.
function prepWing(o) {
  if (!o) return null;
  const P = CONFIG.physics;
  const clStar = P.gravity / (o.cruise * o.cruise);          // lift at the wing's favorite speed
  const cd0 = clStar / (2 * o.glide);                          // drag that gives the listed glide ratio
  const cl0 = 0.65 * clStar, clMax = P.clMaxRatio * clStar, stallDeg = 16;
  const slope = (clMax - cl0) / (stallDeg * D2R);
  const induced = cd0 / (clStar * clStar);
  const alphaStar = Math.min((stallDeg - P.autoStallMarginDeg) * D2R, (clStar - cl0) / slope);
  return {
    cl0, clMax, slope, drag: Math.max(0.00001, cd0 - P.bodyDrag), induced, stability: o.steady,
    stall: stallDeg * D2R, alphaStar, alphaZero: -cl0 / slope, glideAngle: -Math.atan(1 / o.glide),

}

// equipped: { wings:'t-o'|null, rocket:'t-o'|null, length, height, launchRig, fuel, payload }
function parseOpt(key) { if (!key) return null; const [t, o] = key.split('-').map(Number); return { t, o }; }

  const C = CONFIG;
  const w = parseOpt(eq.wings), r = parseOpt(eq.rocket);
  const L = {};
  L.speed = C.launch.baseSpeed + C.seesawLength.speed[eq.length || 0] + C.seesawHeight.speed[eq.height || 0] + C.launchRig.speed[eq.launchRig || 0];
  L.angle = (C.launch.baseAngleDeg + C.seesawHeight.angleDeg[eq.height || 0]) * D2R;
  L.height = C.launch.baseHeight + C.seesawHeight.raise[eq.height || 0];
  L.wing = w ? prepWing(C.wings.tiers[w.t][w.o]) : null;
  L.rocket = r ? C.rockets.tiers[r.t][r.o] : null;
  L.fuelSec = L.rocket ? C.fuelTank.gallons[eq.fuel || 0] * C.fuelTank.secondsPerGallon : 0;
  L.payload = C.payload.strength[eq.payload || 0];
  return L;
}

function hillTerrainY(hill, x) {
  if (!hill) return -1;
  if (x < hill.x - hill.slope || x > hill.x + hill.w + hill.slope) return -1;
  if (x < hill.x) return hill.h * (x - (hill.x - hill.slope)) / hill.slope;
  if (x <= hill.x + hill.w) return hill.h;
  return hill.h * (1 - (x - hill.x - hill.w) / hill.slope);
}

function createFlight(loadout, course) {
  return {
    L: loadout, course,
    t: 0, x: 0, y: loadout.height,
    vx: loadout.speed * Math.cos(loadout.angle), vy: loadout.speed * Math.sin(loadout.angle),
    th: loadout.angle, fuel: loadout.fuelSec, firing: false,
    phase: 'fly',     // fly | skid | slideoff | fall | done
    outcome: null,    // landed | short | over | blocked | splash (endless)
    reason: '', maxY: loadout.height, maxSpeed: loadout.speed,
    coins: 0, events: [], stalled: false, alpha: 0, fuelUsed: 0, endX: 0,

}

// One fixed physics step. input = { up, down, fire }
function stepFlight(F, input, dt) {
  const P = CONFIG.physics;

    aAuto = clamp(W.alphaStar + P.autoPathGain * (pathTarget - gam), W.alphaZero, W.stall - P.autoStallMarginDeg * D2R);
    // Low over the water the pig flares by itself (trades leftover speed for a longer float),
    // so skimming the water isn't a big skill trick. Over the landing hill it just glides in.
    if (P.autoFlareHeight > 0 && F.vy < 0 && F.y < P.autoFlareHeight && hillTerrainY(F.course.hill, F.x) < 0) aAuto = W.stall - P.autoStallMarginDeg * D2R;
  }

  F.firing = fire;
  const stab = P.bodyStability + (W ? W.stability : 0);
  const q = clamp((v / P.stabilitySpeedRef) ** 2, P.stabilityMinQ, P.stabilityMaxQ);
  let dth = inp * P.turnRateDeg * D2R - stab * q * wrapAngle(F.th - (gam + aAuto));
  if (fire) dth += L.rocket.noseUp * D2R;
  F.th = clamp(F.th + dth * dt, -P.maxPitchDeg * D2R, P.maxPitchDeg * D2R);

  const a = wrapAngle(F.th - gam);

    cl = W.cl0 + W.slope * a; cd += W.drag + W.induced * cl * cl;

    if (F.stalled) { cl *= P.stallLiftMult; cd += P.stallDragAdd; }

    ax += L.rocket.thrust * Math.cos(F.th); ay += L.rocket.thrust * Math.sin(F.th);
    F.fuel = Math.max(0, F.fuel - dt); F.fuelUsed += dt;

  if (F.course.spawner) F.course.spawner(F, F.course);

}

function collide(F, C) {
  const P = CONFIG.physics, r = P.pigRadius;
  if (C.obstacles) for (const o of C.obstacles) {
    if (o.broken) continue;
    if (F.x + r >= o.x - o.width / 2 && F.x - r <= o.x + o.width / 2 && F.y - r <= o.top) {
      if (F.L.payload >= o.strength) {
        o.broken = true; F.events.push({ type: 'smash', o }); // ramming costs no speed and no fuel
      } else {
        o.hit = true; F.events.push({ type: 'bonk', o });
        F.x = o.x - o.width / 2 - r; F.vx = 0; F.vy = Math.min(F.vy, 0);
        F.phase = 'fall'; F.outcome = 'blocked'; F.reason = o.type; return;
      }
    }
  }
  if (C.coins) for (const c of C.coins) {
    if (c.taken) continue;
    if ((F.x - c.x) ** 2 + (F.y - c.y) ** 2 <= CONFIG.coins.pickupRadius ** 2) { c.taken = true; F.coins += 1; F.events.push({ type: 'coin', c }); }
  }
  if (C.powerups) for (const p of C.powerups) {
    if (p.taken) continue;
    if ((F.x - p.x) ** 2 + (F.y - p.y) ** 2 <= CONFIG.powerups.pickupRadius ** 2) {
      p.taken = true;
      const v = Math.hypot(F.vx, F.vy) || 1;
      F.vx += CONFIG.powerups.gustSpeed * F.vx / v;
      F.vy += CONFIG.powerups.gustSpeed * F.vy / v + CONFIG.powerups.gustUp;
      const coins = rollPowerupCoins(C.rng || Math.random);
      F.coins += coins; p.coins = coins;
      F.events.push({ type: 'gust', p, coins });
    }
  }
  const hill = C.hill;
  if (hill) {
    const ty = hillTerrainY(hill, F.x);
    if (ty >= 0 && F.y <= ty) {
      if (F.x >= hill.x && F.x <= hill.x + hill.w) {
        if (F.vy < -P.bounceSpeed) { // too steep and fast: bounce instead of landing
          F.y = hill.h + 0.01; F.vy = -F.vy * P.bounceKeep; F.events.push({ type: 'bounce' }); return;
        }
        F.y = hill.h; F.vy = 0; F.phase = 'skid'; F.landX = F.x; F.landSpeed = F.vx; F.events.push({ type: 'touchdown' });
        return;
      }
      F.outcome = F.x < hill.x ? 'short' : 'over';
      F.reason = F.x < hill.x ? 'hillside' : 'backside';
      F.vx *= 0.3; F.vy = Math.min(F.vy, 0); F.phase = 'fall'; F.y = Math.max(F.y, 0.01);
      return;
    }

}

// After touchdown the pig skids. Arriving too fast slides it off the far edge (overshoot).
function stepSkid(F, dt) {
  const P = CONFIG.physics, hill = F.course.hill;
  if (F.phase === 'skid') {
    F.vx = Math.max(0, F.vx - P.skidFriction * P.gravity * dt);
    F.x += F.vx * dt;
    F.th += (0 - F.th) * Math.min(1, 6 * dt);
    if (F.x > hill.x + hill.w) { F.phase = 'slideoff'; F.outcome = 'over'; F.reason = 'skid'; }
    else if (F.vx <= 0.05) finish(F, 'landed');
  } else {
    F.vy -= P.gravity * dt; F.x += F.vx * dt; F.y += F.vy * dt;
    const ty = hillTerrainY(hill, F.x);
    if (ty >= 0 && F.y < ty) { F.y = ty; F.vy = 0; }
    F.th = clamp(F.th - 1.5 * dt, -0.8, 0.8);

function finish(F, outcome) {
  F.phase = 'done'; F.outcome = outcome; F.endX = F.x;
  F.events.push({ type: outcome === 'landed' ? 'landed' : 'splash' });
}
function rollPowerupCoins(rng) {
  const T = CONFIG.powerups.coinTable;
  let r = rng() * T.reduce((s, b) => s + b.chance, 0);
  for (const b of T) { if (r < b.chance) return b.min + Math.floor(rng() * (b.max - b.min + 1)); r -= b.chance; }

// No-input prediction of where a loadout flies (rockets held). Used to place coins and powerups near your route.
function predictPath(loadout, maxX) {
  const F = createFlight(loadout, { hill: null });
  const pts = [[F.x, F.y]];
  for (let i = 0; i < 30 * 240 && F.phase !== 'done'; i++) {
    stepFlight(F, { fire: true }, 1 / 30);
    if (i % 3 === 0) pts.push([F.x, F.y, F.t]);
    if (maxX && F.x > maxX) break;
  }
  pts.push([F.x, 0, F.t]);
  return pts;
}
function pathYAt(pts, x) {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (pts[i][0] >= x) {
    const a = pts[i - 1], b = pts[i]; const u = (x - a[0]) / ((b[0] - a[0]) || 1); return a[1] + (b[1] - a[1]) * u;
  }

}

/* ===================== ECONOMY RULES (no DOM) ===================== */
function unlockLevel(cat) { return CONFIG.unlocks[UNLOCK_OF[cat]]; }
// The level a tier "belongs to" sets its price: tier 1 = the level the category unlocks on, etc.
function tierLevel(cat, t) { return unlockLevel(cat) + t - 1; }
function tierPrice(cat, t) {
  const E = CONFIG.economy;
  if (t > MAX_TIER[cat]) return Math.round(E.upgradeCost[11] * E.endlessTierMult * E.share[cat]);
  return Math.round(E.upgradeCost[clamp(tierLevel(cat, t), 2, 11)] * E.share[cat]);
}
function sellPrice(cat, t) { return Math.floor(tierPrice(cat, t) * CONFIG.economy.sellBack); }
// Cap: starts at 1 when the category unlocks, +1 for each level passed after that. Endless mode: everything incl. Endless tier.
function tierCap(cat, level, endless) {
  if (endless) return MAX_TIER[cat] + 1;
  const u = unlockLevel(cat);
  if (level < u) return 0;
  return Math.min(MAX_TIER[cat], level - u + 1);
}
// Shop categories open on a level (seesaw counts once; powerups count as a category).
function openCategories(level) { return Object.values(CONFIG.unlocks).filter(u => u <= level).length; }
// How centered the pig stopped between the two flags: 1 = dead center, 0 = at (or past) a flag.
function landingAccuracy(hill, x) {
  const half = hill.w / 2 - 1.5; // flags stand 1.5 m in from each edge
  return clamp(1 - Math.abs(x - (hill.x + hill.w / 2)) / half, 0, 1);
}
// accuracy defaults to 1 (the most a level can pay).
function levelPayout(level, accuracy = 1) {
  const E = CONFIG.economy, price = E.upgradeCost[Math.min(11, level + 1)];
  const swing = 1 - E.edgePayoutUpgrades / E.payoutUpgrades; // share of the payout that depends on aim (1/6)
  const n = E.payoutPerCategory ? Math.min(E.payoutUpgrades, openCategories(level + 1)) : E.payoutUpgrades;
  if (n >= E.payoutUpgrades) return Math.round(n * price * (1 - swing * (1 - accuracy)));
  return Math.round(n * price * (1 + swing * accuracy) + E.mistakeCushion * price); // floor = gear + one wrong-pick swap
}
function coinsForLevel(level) { return Math.max(1, Math.round(CONFIG.economy.upgradeCost[Math.max(2, level)] * CONFIG.coins.perRunShare)); }
function powerupCost(n) { return CONFIG.powerups.firstCost * Math.pow(CONFIG.powerups.costMult, n); }
function milestonePay(d) { return Math.round(CONFIG.endless.milestoneBase + CONFIG.endless.milestonePerMeter * d); }

  g.closePath();

}

// ---------- THE PIG ----------
function drawPig(g, opts) {
  // opts: { wing:'t-o', rocket:'t-o', payload:n, firing, t, blink, happy, flap }
  const t = opts.t || 0, flap = opts.flap != null ? opts.flap : Math.sin(t * 5) * 0.5;
  if (opts.wing && ART.wing[opts.wing]) { g.save(); g.translate(-0.1, -0.45); ART.wing[opts.wing](g, flap, t); g.restore(); }
  if (opts.rocket && ART.rocket[opts.rocket]) { g.save(); ART.rocket[opts.rocket](g, t); g.restore(); }
  // legs (really small)
  for (const [x, y] of [[-0.55, 0.5], [-0.32, 0.56], [0.38, 0.55], [0.58, 0.48]]) ell(g, x, y + 0.08, 0.1, 0.13, '#e88aa0', '#c05b74', 0.03);
  // curly tail
  g.beginPath(); g.moveTo(-0.98, -0.05); g.bezierCurveTo(-1.3, -0.2, -1.3, 0.15, -1.12, 0.08); g.bezierCurveTo(-1.0, 0.0, -1.2, -0.25, -1.35, -0.15);
  g.strokeStyle = '#e07a95'; g.lineWidth = 0.07; g.lineCap = 'round'; g.stroke();
  // egg body: rounder at the back, pointier at the nose
  g.beginPath(); g.moveTo(1.05, 0.0);
  g.bezierCurveTo(1.05, -0.5, 0.4, -0.66, -0.15, -0.64);
  g.bezierCurveTo(-0.8, -0.62, -1.08, -0.3, -1.05, 0.02);
  g.bezierCurveTo(-1.02, 0.42, -0.6, 0.62, -0.05, 0.62);
  g.bezierCurveTo(0.55, 0.62, 1.05, 0.45, 1.05, 0.0);
  const grad = g.createLinearGradient(0, -0.7, 0, 0.7); grad.addColorStop(0, '#ffc2d1'); grad.addColorStop(1, '#f48fb1');
  g.fillStyle = grad; g.fill(); g.strokeStyle = '#c05b74'; g.lineWidth = 0.05; g.stroke();
  ell(g, -0.2, -0.32, 0.45, 0.13, 'rgba(255,255,255,0.35)', null, 0, -0.1);
  // ear
  poly(g, [[0.25, -0.55], [0.38, -0.92], [0.55, -0.52]], '#f48fb1', '#c05b74', 0.04);
  poly(g, [[0.32, -0.56], [0.39, -0.8], [0.49, -0.55]], '#ff8fab');
  // goggles: strap + lens
  g.beginPath(); g.moveTo(0.38, -0.55); g.quadraticCurveTo(0.45, -0.1, 0.42, 0.1); g.strokeStyle = '#5d4037'; g.lineWidth = 0.09; g.stroke();
  ell(g, 0.68, -0.22, 0.21, 0.2, '#6d4c41');
  ell(g, 0.68, -0.22, 0.15, 0.14, opts.happy ? '#b3e5fc' : '#4fc3f7');
  if (opts.happy) { g.beginPath(); g.arc(0.68, -0.2, 0.08, Math.PI * 1.1, Math.PI * 1.9); g.strokeStyle = '#263238'; g.lineWidth = 0.04; g.stroke(); }
  else ell(g, 0.71, -0.21, 0.05, opts.blink ? 0.01 : 0.06, '#263238');
  ell(g, 0.63, -0.28, 0.04, 0.03, 'rgba(255,255,255,0.9)');
  // snout
  ell(g, 1.04, 0.05, 0.17, 0.19, '#ff9fb5', '#c05b74', 0.04);
  ell(g, 1.04, -0.01, 0.025, 0.045, '#c05b74'); ell(g, 1.05, 0.1, 0.025, 0.045, '#c05b74');
  // cheek + smile
  ell(g, 0.62, 0.15, 0.1, 0.06, 'rgba(255,105,140,0.45)');
  g.beginPath(); g.arc(0.8, 0.2, 0.1, 0.2, 1.5); g.strokeStyle = '#a3445c'; g.lineWidth = 0.03; g.stroke();
  if (opts.payload && ART.payload[opts.payload]) ART.payload[opts.payload](g);
}

function drawGearThumb(cv, kind, key, t) {

  if (kind === 'rocket') { g.translate(-0.3, -0.6); g.scale(1.3, 1.3); g.translate(1.0, 0.75); ART.rocket[key] && ART.rocket[key](g, t || 0); }
  if (kind === 'payload') { g.translate(0, -0.6); g.scale(1.6, 1.6); ART.payload[key] && ART.payload[key](g); }

function drawObstacle(g, o, t) {

<script>

function canBuyOpt(cat, t, o) {

/* ===================== RENDER ===================== */
function pigUnitMeters() { return pigUnitPx() / cam.ppm; }
function pigUnitPx() { const still = screen === 'hangar' || screen === 'menu' || screen === 'launching'; return clamp(cam.ppm * 1.3, 17, (still ? CONFIG.view.shopPigPixels : CONFIG.view.pigPixels) / 2); }
const ANCHOR_X = 0.33, ANCHOR_Y = 0.5;
function worldTransform() { g.setTransform(DPR * cam.ppm, 0, 0, DPR * cam.ppm, DPR * (W * ANCHOR_X - cam.x * cam.ppm), DPR * (H * ANCHOR_Y + cam.y * cam.ppm)); }

function waterScreenY() { return H * ANCHOR_Y + cam.y * cam.ppm; }
function updateCamera(dt) {
  let tx, ty, tp;
  if (screen === 'flight' || (screen === 'results' && flight) || (screen === 'launching')) {
    const F = flight;
    const sp = Math.hypot(F.vx, F.vy);
    tp = clamp((H * 0.62) / Math.max(22, F.y + 16) / (1 + sp / 120), CONFIG.view.minZoom, CONFIG.view.maxZoom);
    if (screen === 'launching') tp = clamp(H / 900 * CONFIG.view.shopZoom, 8, 60);
    tx = screen === 'launching' ? -3 : F.x;
    cam.ppm += (tp - cam.ppm) * Math.min(1, dt * 1.6);
    ty = Math.max(0.35 * H / cam.ppm, F.y - 0.3 * H / cam.ppm);
    cam.x += (tx - cam.x) * Math.min(1, dt * (screen === 'flight' ? 12 : 4));
    cam.y += (ty - cam.y) * Math.min(1, dt * 5);
    return;
  }
  // hangar / menu: look at the launch site. Leave room for the shop panel on the right.
  tp = clamp(H / 900 * CONFIG.view.shopZoom, 8, 60);
  cam.ppm += (tp - cam.ppm) * Math.min(1, dt * 3);
  tx = screen === 'hangar' ? -3 : 2;
  cam.x += (tx - cam.x) * Math.min(1, dt * 3);
  cam.y += (0.35 * H / cam.ppm - cam.y) * Math.min(1, dt * 3);
}
function drawWorld() {

  const viewL = cam.x - (W * ANCHOR_X) / cam.ppm - 50, viewR = cam.x + (W * (1 - ANCHOR_X)) / cam.ppm + 50;
  // launch site
  if (viewL < 20) {

    const eq = screen === 'hangar' || screen === 'menu' ? (SAVE && (SAVE.run || SAVE.endless) ? activeEquippedSafe() : freshEquipped()) : launchEq;

    if (screen === 'launching') {
      const L = CONFIG.launch, tt = launchT;
      const G = seesawGeom(eq); const farY0 = G.pivotY - G.len * Math.sin(G.restA) + 1.4;

    else if (p.kind === 'star') { g.fillStyle = p.color; g.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? s * 0.45 : s; g.lineTo(p.x + Math.cos(i * Math.PI / 5) * rr, -p.y + Math.sin(i * Math.PI / 5) * rr); } g.fill(); }

    else if (p.kind === 'puff') ell(g, p.x, -p.y, s * (1.6 - a), s * (1.6 - a), p.color);

  g.fillStyle = 'rgba(255,248,238,0.92)'; rrect(g, 12, 12, 250, F.L.rocket ? 132 : 108, 14, 'rgba(255,248,238,0.92)');
  g.fillStyle = '#3b2a20'; g.font = 'bold 14px sans-serif';
  g.fillText(mode === 'endless' ? `Fly Infinitely · best ${Math.round(SAVE.bestEndless || 0)} m` : `Level ${flightLevel} · hill ${hillRange(flightLevel)}`, 24, 34);
  g.font = 'bold 34px sans-serif'; g.fillText(Math.round(F.x) + ' m', 24, 70);
  g.font = '13px sans-serif'; g.fillText(`height ${Math.round(F.y)} m   speed ${Math.round(Math.hypot(F.vx, F.vy))} m/s   🪙 ${F.coins}`, 24, 92);
  if (F.stalled) { g.fillStyle = '#c62828'; g.font = 'bold 13px sans-serif'; g.fillText('STALL! nose too high', 24, 110); }
  if (F.L.rocket) {
    const fr = F.fuel / Math.max(0.001, F.L.fuelSec);
    g.fillStyle = '#3b2a20'; g.font = 'bold 12px sans-serif'; g.fillText('FUEL', 24, 130);
    rrect(g, 64, 120, 180, 12, 6, '#e0d3c3'); if (fr > 0) rrect(g, 64, 120, 180 * fr, 12, 6, F.firing ? '#ff7043' : '#ffa726');
  }
  // controls hint
  g.font = '13px sans-serif'; g.fillStyle = 'rgba(255,255,255,0.95)';
  g.fillText(F.L.rocket ? '↑ ↓ tilt the nose    SPACE fire rockets' : '↑ ↓ tilt the nose', 16, H - 16);
  // hill indicator
  if (course && course.hill) {
    const hx = (course.hill.x - cam.x) * cam.ppm + W * ANCHOR_X;
    if (hx > W - 20) {
      const d = Math.round(course.hill.x - F.x);
      rrect(g, W - 150, H * 0.42, 136, 34, 10, 'rgba(255,248,238,0.92)');
      g.fillStyle = '#2e7d32'; g.font = 'bold 15px sans-serif'; g.fillText(`Hill ▶ ${d} m`, W - 138, H * 0.42 + 22);
    }
  }
  // obstacle warning arrow
  if (course) for (const o of course.obstacles) {
    if (o.broken) continue; const ox = (o.x - cam.x) * cam.ppm + W * ANCHOR_X;
    if (ox > W && o.x - F.x < 250) { const oy = clamp(waterScreenY() - o.top * cam.ppm, 60, H - 60); poly(g, [[W - 8, oy], [W - 26, oy - 12], [W - 26, oy + 12]], o.strength <= F.L.payload ? '#66bb6a' : '#ef5350'); g.fillStyle = '#fff'; g.font = 'bold 12px sans-serif'; g.fillText(String(o.strength), W - 40, oy + 4); }
  }
}
function drawMenuScene(dt) {
  // a pig gliding lazily across the title screen
  worldTransform();
  const span = W / cam.ppm, x = cam.x - span * 0.4 + ((time * 3) % (span * 1.1)), y = 0.55 * H / cam.ppm + Math.sin(time) * 1.5;
  drawPigAt(x, y, Math.sin(time) * 0.1, { wings: '1-1', rocket: null, payload: 0 }, false, true);
}
function drawEnding() {
  screenTransform();
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#ffcc80'); sky.addColorStop(0.6, '#f8bbd0'); sky.addColorStop(1, '#b3e5fc');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  ell(g, W / 2, H * 1.25, W * 0.8, H * 0.65, '#66bb6a');
  ell(g, W / 2, H * 1.3, W * 0.7, H * 0.6, '#81c784');
  const gy = H * 0.66, s = Math.min(W, H) / 22;
  g.save(); g.translate(0, 0);
  // barn
  g.fillStyle = '#c62828'; g.fillRect(W * 0.12, gy - s * 6, s * 6, s * 5); poly(g, [[W * 0.12 - s * 0.5, gy - s * 6], [W * 0.12 + s * 3, gy - s * 9], [W * 0.12 + s * 6.5, gy - s * 6]], '#5d4037');
  g.fillStyle = '#fff'; g.fillRect(W * 0.12 + s * 2, gy - s * 3.5, s * 2, s * 2.5);
  const t = time;
  const friends = [[drawSheep, 0.28, 1.6], [drawCow, 0.38, 1.4], [drawChicken, 0.46, 1.3], [drawSheep, 0.62, 1.4], [drawCow, 0.72, 1.6], [drawChicken, 0.56, 1.2], [drawChicken, 0.82, 1.2]];
  for (const [fn, fx, sc] of friends) fn(g, W * fx, gy, s * sc, t);
  // other pigs
  for (const [fx, sc] of [[0.33, 0.9], [0.66, 0.85]]) { g.save(); g.translate(W * fx, gy - s * 0.3 - Math.abs(Math.sin(t * 3 + fx * 10)) * s * 0.4); g.scale(-s * sc, s * sc); drawPig(g, { t, happy: true, flap: 0 }); g.restore(); }
  // our hero, in the middle, still in goggles
  g.save(); g.translate(W * 0.5, gy - s * 0.6 - Math.abs(Math.sin(t * 4)) * s * 0.8); g.scale(s * 1.4, s * 1.4); drawPig(g, { t, happy: true, flap: 0, wing: SAVE && SAVE.run && SAVE.run.equipped.wings }); g.restore();
  // hearts + confetti
  for (let i = 0; i < 14; i++) { const hx = W * (0.2 + 0.6 * ((i * 37) % 100) / 100), hy = gy - s * 3 - ((t * 40 + i * 50) % (H * 0.5)); g.globalAlpha = 0.8; g.fillStyle = i % 2 ? '#e91e63' : '#ffd54f'; g.font = `${s}px sans-serif`; g.fillText(i % 2 ? '❤' : '✦', hx, hy); }
  g.globalAlpha = 1; g.restore();
}

/* ===================== MAIN LOOP ===================== */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; time += dt;
  // play time for the "fastest to beat all 10 levels" board (level run only, not while idle on the menu)
  if (mode === 'level' && !PRACTICE && SAVE && SAVE.run && !SAVE.run.completed && screen !== 'menu' && screen !== 'ending' && !document.hidden) SAVE.run.playSec = (SAVE.run.playSec || 0) + dt;
  if (screen === 'launching') {
    launchT += dt;
    if (launchT >= CONFIG.launch.dropTime + CONFIG.launch.flingTime) beginFlight();
  }
  if (screen === 'flight' || (screen === 'results' && flight && flight.phase !== 'done')) { updateFlight(dt); tutFlight(dt); }
  updateParticles(dt);
  updateCamera(dt);
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  if (screen === 'ending') drawEnding();
  else {
    drawWorld();
    if (screen === 'menu') drawMenuScene(dt);
    if (screen === 'flight') drawHUD();
  }
  requestAnimationFrame(frame);
}
showMenu();
initAccounts();
requestAnimationFrame(frame);
</script>
